services:
  outbox-dispatcher:
    build:
      context: .
      dockerfile: docker/workers.Dockerfile
    command: ["node", "--experimental-transform-types", "--import", "./scripts/worker-register.mjs", "scripts/worker-main.ts", "outbox-dispatcher"]
    env_file: .env.local
  sla-monitor:
    build:
      context: .
      dockerfile: docker/workers.Dockerfile
    command: ["node", "--experimental-transform-types", "--import", "./scripts/worker-register.mjs", "scripts/worker-main.ts", "sla-monitor"]
    env_file: .env.local
