<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>VASA-EOS is offline</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; background: #f8fafc; color: #0f172a; }
      main { width: min(36rem, calc(100% - 3rem)); padding: 2rem; border: 1px solid #cbd5e1; border-radius: 1rem; background: white; box-shadow: 0 1rem 2rem rgb(15 23 42 / 8%); }
      h1 { margin-top: 0; font-size: 1.75rem; }
      p { line-height: 1.6; }
      button { min-height: 2.75rem; padding: 0 1rem; border: 0; border-radius: .5rem; background: #1d4ed8; color: white; font: inherit; font-weight: 600; cursor: pointer; }
      button:focus-visible { outline: .2rem solid #f59e0b; outline-offset: .2rem; }
      @media (prefers-color-scheme: dark) { body { background: #020617; color: #e2e8f0; } main { background: #0f172a; border-color: #334155; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Connection unavailable</h1>
      <p>VASA-EOS could not reach the secure service. No student, teacher, scheme, notification, or governance record has been stored for offline display.</p>
      <p>Reconnect to the authorised Tamil Nadu School Education network, then retry.</p>
      <button type="button" onclick="location.reload()">Retry connection</button>
    </main>
  </body>
</html>
