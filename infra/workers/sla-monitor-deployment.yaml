apiVersion: apps/v1
kind: Deployment
metadata:
  name: vasa-sla-monitor
spec:
  replicas: 1
  selector:
    matchLabels: { app: vasa-sla-monitor }
  template:
    metadata:
      labels: { app: vasa-sla-monitor }
    spec:
      serviceAccountName: vasa-worker
      containers:
        - name: worker
          image: vasa-eos-se-worker:latest
          command: ["node", "--disable-warning=MODULE_TYPELESS_PACKAGE_JSON", "--experimental-strip-types", "lib/workers/sla-monitor-worker.ts"]
          envFrom: [{ secretRef: { name: vasa-runtime-secrets } }]
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          livenessProbe: { httpGet: { path: /workers/sla-monitor/health, port: 3000 }, initialDelaySeconds: 20, periodSeconds: 30 }
          readinessProbe: { httpGet: { path: /workers/sla-monitor/health, port: 3000 }, initialDelaySeconds: 10, periodSeconds: 15 }
