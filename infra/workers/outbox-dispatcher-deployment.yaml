apiVersion: apps/v1
kind: Deployment
metadata:
  name: vasa-outbox-dispatcher
spec:
  replicas: 2
  selector:
    matchLabels: { app: vasa-outbox-dispatcher }
  template:
    metadata:
      labels: { app: vasa-outbox-dispatcher }
    spec:
      serviceAccountName: vasa-worker
      containers:
        - name: worker
          image: vasa-eos-se-worker:latest
          command: ["node", "--disable-warning=MODULE_TYPELESS_PACKAGE_JSON", "--experimental-strip-types", "lib/workers/outbox-dispatcher-worker.ts"]
          envFrom: [{ secretRef: { name: vasa-runtime-secrets } }]
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          livenessProbe: { httpGet: { path: /workers/outbox-dispatcher/health, port: 3000 }, initialDelaySeconds: 20, periodSeconds: 30 }
          readinessProbe: { httpGet: { path: /workers/outbox-dispatcher/health, port: 3000 }, initialDelaySeconds: 10, periodSeconds: 15 }
