apiVersion: apps/v1
kind: Deployment
metadata:
  name: vasa-outbox-dispatcher
spec:
  replicas: 2
  selector:
    matchLabels: { app: vasa-outbox-dispatcher }
  template:
    metadata:
      labels: { app: vasa-outbox-dispatcher }
    spec:
      serviceAccountName: vasa-worker
      containers:
        - name: worker
          image: vasa-eos-se-worker:latest
          command: ["node", "--experimental-transform-types", "--import", "./scripts/worker-register.mjs", "scripts/worker-main.ts", "outbox-dispatcher"]
          envFrom: [{ secretRef: { name: vasa-runtime-secrets } }]
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          livenessProbe: { httpGet: { path: /health, port: 3001 }, initialDelaySeconds: 20, periodSeconds: 30 }
          readinessProbe: { httpGet: { path: /health, port: 3001 }, initialDelaySeconds: 10, periodSeconds: 15 }
