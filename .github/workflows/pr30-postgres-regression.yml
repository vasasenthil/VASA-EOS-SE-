name: pr30-postgres-regression
on:
  pull_request:
    paths:
      - 'migrations/**'
      - 'lib/events/**'
      - 'lib/ml/**'
      - 'lib/persistence/**'
      - 'lib/stores/**'
      - 'lib/workflow-runtime/**'
      - 'lib/workers/**'
      - 'lib/auth/**'
      - 'scripts/deploy/**'
      - 'tests/sql/**'
      - '.github/workflows/pr30-postgres-regression.yml'
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pr30
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pr30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/sql/setup-pr30.sql
      - run: node --experimental-strip-types tests/sql/migration-runner-check.mjs

  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run governance:verify-acceptance
      - run: pnpm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
